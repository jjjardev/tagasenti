[project]
name = "tagasenti"
version = "1.0.0"
description = "TagaSenti — Tagalog/Taglish sentiment analysis (xlm-roberta-large)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jessie James Jarder" }]
keywords = ["sentiment-analysis", "tagalog", "taglish", "filipino", "nlp"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2,<3.0",
  "transformers>=4.40,<5.0",
  "datasets>=2.14",
  "accelerate>=0.27",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "huggingface-hub>=0.22",
  "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/jjjardev/tagasenti"
Dataset = "https://huggingface.co/datasets/jjjardev/tagasenti"
Model = "https://huggingface.co/jjjardev/tagasenti_model"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]
demo = ["flask>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
